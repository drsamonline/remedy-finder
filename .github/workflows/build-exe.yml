name: Build portable Windows launcher

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build single-file bundle
        run: python build.py
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Build RemedyFinder.exe
        run: pyinstaller --onefile --noconsole --name RemedyFinder --add-data "dist/remedy-finder.html;." launcher.py
      - name: Zip release assets
        run: |
          Compress-Archive -Path dist/remedy-finder.html -DestinationPath remedy-finder-html.zip -Force
          Compress-Archive -Path dist/remedy-finder.exe -DestinationPath remedy-finder-windows.zip -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: RemedyFinder-windows
          path: dist/RemedyFinder.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/RemedyFinder.exe
            dist/remedy-finder.html
